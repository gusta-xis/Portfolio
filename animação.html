<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Luiz Gustavo</title>
    <!-- Importando a mesma fonte do seu index.html para consistência -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Fundo roxo pastel mantido */
            background-color: #D8BFD8; 
            color: #333333; 
            font-family: 'Josefin Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
            padding: 20px;
        }

        .typing {
            font-size: 2.5em;
            border-right: 3px solid #ad20fc;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            margin: 0 auto;
            animation: typing 2.5s steps(30, end) forwards, blink 0.75s step-end infinite;
        }

        .subtitle {
            font-size: 1.5em;
            margin-top: 15px;
            opacity: 0;
            /* O subtítulo aparece suavemente após o nome ser digitado */
            animation: fadeInSubtitle 1.5s ease-in-out 2.5s forwards; 
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInSubtitle {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para telas de celulares */
        @media (max-width: 600px) {
            .typing {
                font-size: 1.6em;
            }
            .subtitle {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="typing">Olá, eu sou Luiz Gustavo</h1>
        <!-- Texto atualizado para refletir o seu perfil atual -->
        <p class="subtitle">UX/UI Designer & Desenvolvedor</p>
        
        <script>
            window.addEventListener('load', () => {
                // Redireciona para o index.html após 5 segundos
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);
            });
        </script>
    </div>
</body>
</html>
